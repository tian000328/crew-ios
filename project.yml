name: Crew
options:
  bundleIdPrefix: com.crewapp
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  Crew:
    type: application
    platform: iOS
    sources:
      - path: Crew
        excludes:
          - "www"
      - path: Crew/www
        type: folder
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Crew/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.crewapp.crew
        PRODUCT_NAME: Crew
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_BITCODE: NO
